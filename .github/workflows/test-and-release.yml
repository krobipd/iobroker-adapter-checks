name: Test and Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Every job names what it needs on top of reading the repository (tooling round 110).
permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type checking and linting are platform independent — run them once, not nine times.
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # The checks walk the file system, so they do get tested on every platform.
  tests:
    needs: [check-and-lint]

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

  release-tag-guard:
    # Runs on every event and passes on anything but a release tag: ci-passed counts a skipped job as failed, so a
    # job-level tag condition would turn every pull request red.
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A release tag sits on the default branch and names the manifest version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The deploy job publishes whatever package.json says, for whatever commit the tag points to
          # (ioBroker/testing-action-deploy compares neither). The release script pushes the branch first and the
          # tag second, so a real release tag is always on the default branch by the time this runs. What this job
          # cannot see: whether the local release run (the stamp) happened — that stays the pre-push guard's job.
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "not a release tag ($GITHUB_REF) — nothing to check"
              exit 0
              ;;
          esac
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="v$(jq -r '.version // ""' package.json)"
          FAIL=0
          if [ "$TAG" != "$PKG" ]; then
            echo "::error ::Tag $TAG does not match package.json version $PKG — npm would publish $PKG"
            FAIL=1
          fi
          # Every adapter carries io-package.json; a plain npm package (the check package itself) does not.
          if [ -f io-package.json ]; then
            IOPKG="v$(jq -r '.common.version // ""' io-package.json)"
            if [ "$TAG" != "$IOPKG" ]; then
              echo "::error ::Tag $TAG does not match io-package.json common.version $IOPKG"
              FAIL=1
            fi
          fi
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error ::Tag $TAG points to $GITHUB_SHA, which is not on ${DEFAULT_BRANCH} — a release is cut from the default branch only"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✓ $TAG is on ${DEFAULT_BRANCH} and matches the manifest version"

  deploy:
    needs: [check-and-lint, tests, release-tag-guard]

    # npm trusted publishing needs the id-token permission — and only this job holds it. No dependency script runs here
    # (`--ignore-scripts`) and no cache is restored: the job that can publish executes only this repository's own code.
    permissions:
      contents: read
      id-token: write

    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

  # The GitHub release needs write access to the repository — kept apart from the job that holds the npm token.
  github-release:
    needs: [deploy]

    permissions:
      contents: write

    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  ci-passed:
    # The one required check of the automerge ruleset: green only when every job that deploy waits for
    # is green (every matrix leg, every gate job); a job skipped because of a red dependency fails it.
    if: ${{ !cancelled() }}
    needs: [check-and-lint, tests, release-tag-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Every job deploy waits for passed
        run: echo '${{ toJSON(needs.*.result) }}' | jq -e 'all(. == "success")'
