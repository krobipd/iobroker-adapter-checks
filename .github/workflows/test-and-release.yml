name: Test and Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type checking and linting are platform independent — run them once, not nine times.
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # The checks walk the file system, so they do get tested on every platform.
  tests:
    needs: [check-and-lint]

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

  deploy:
    needs: [check-and-lint, tests]

    # npm trusted publishing needs the id-token permission; releases need contents.
    permissions:
      contents: write
      id-token: write

    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  ci-passed:
    # The one required check of the automerge ruleset: green only when every job that deploy waits for
    # is green (every matrix leg, every gate job); a job skipped because of a red dependency fails it.
    if: ${{ !cancelled() }}
    needs: [check-and-lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every job deploy waits for passed
        run: echo '${{ toJSON(needs.*.result) }}' | jq -e 'all(. == "success")'
